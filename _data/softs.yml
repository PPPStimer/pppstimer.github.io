- id: stimstudio
  name: StimStudio
  color: orange
  icon: /assets/img/stimstudio-icon.svg
  title: "StimStudio — a multitrack e-stim pattern studio"
  # GitHub repo "owner/name": version, size, download link, downloads and changelog
  # are loaded live from its Releases. Values below are the fallback.
  repo: PPPStimer/StimStudio
  asset: ""         # no build files yet: the release's source archive is offered
  version: v1.0.0
  size: 3.1 MB
  desc: "Build e-stim signals the way you build music in a DAW: arrange clips, generators and effects on a timeline, write a script to a video or record it live with the mouse, and play it on a DG-Lab Coyote 3 through the Howl app, on a sound card or on Intiface toys."
  features:
    - Timeline with tracks, clips, crossfades, markers, envelopes and full undo
    - Over 40 generators, from ports of Howl's activities to rhythms, tactile illusions and breathing pacers
    - Effect chains per clip, track and master, with automation and audio-driven modulation
    - "True three-phase (triphase) stimulation: position control across three electrodes"
    - Scripting to video, live recording with the mouse and an automatic session builder
    - Output to Coyote 3 via Howl, a sound card (continuous / wavelet) and Intiface; export to .hwl and WAV/FLAC
    - Safety check for sudden jumps and long peaks, soft start, power limits and an Esc PANIC key
  file: StimStudio-1.0.0.zip (source)
  download: "https://github.com/PPPStimer/StimStudio/releases/latest"
  python: "Python 3.14+"
  requirements:
    - numpy>=2.4
    - PyQt6>=6.11
    - pyqtgraph>=0.14
    - soundfile>=0.14
    - sounddevice>=0.5
    - opensimplex>=0.4.5
  changelog:
    - version: v1.0.0
      date: 2026-11-22
      changes:
        - First release
  faq:
    - q: How do I install and start it?
      a: "Install Python 3.14 or newer, download the release and unpack it. In the unpacked folder run pip install -r requirements.txt (it also installs the optional packages for audio import and video), then double-click StimStudio.pyw."
    - q: Which devices can it play on?
      a: "A DG-Lab Coyote 3 through the Howl app on an Android phone (remote access over Wi-Fi), an e-stim box with an audio input connected to your sound card, and vibrators and other toys through Intiface Central. You can also export .hwl files for Howl and WAV/FLAC audio."
    - q: Is it safe?
      a: "Electrical stimulation can injure you. Read the Safety section of the README before you connect any device: use e-stim only below the waist, never with a pacemaker or heart condition, start at zero power and keep Esc (PANIC) at hand. StimStudio is not a medical device, and you use it at your own risk."
    - q: Does it run on Linux or macOS?
      a: "It is developed and tested on Windows. It is plain Python and Qt, so it should run elsewhere, but that hasn't been tested yet; on Linux sounddevice also needs PortAudio (libportaudio2)."
    - q: How do I update to a new version?
      a: "Download the latest release and replace the old files, then run the pip command again in case dependencies changed. Your projects, presets and settings are kept."
  screenshots:
    - /assets/img/stimstudio-1.jpg
    - /assets/img/stimstudio-2.jpg
    - /assets/img/stimstudio-3.jpg

