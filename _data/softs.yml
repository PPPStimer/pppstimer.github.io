- id: stimstudio
  name: StimStudio
  color: orange
  icon: /assets/img/stimstudio-icon.svg
  title: "StimStudio — a multitrack e-stim pattern studio"
  # GitHub repo "owner/name": version, size, download link, downloads and changelog
  # are loaded live from its Releases. Values below are the fallback.
  repo: PPPStimer/StimStudio
  asset: ""         # no build files yet: the release's source archive is offered
  version: v1.0.0
  size: 3.1 MB
  desc: "Build e-stim signals the way you build music in a DAW: arrange clips, generators and effects on a timeline, write a script to a video or record it live with the mouse, and play it on a DG-Lab Coyote 3 through the Howl app, on a sound card or on Intiface toys."
  features:
    - Timeline with tracks, clips, crossfades, markers, envelopes and full undo
    - Over 40 generators, from ports of Howl's activities to rhythms, tactile illusions and breathing pacers
    - Effect chains per clip, track and master, with automation and audio-driven modulation
    - "True three-phase (triphase) stimulation: position control across three electrodes"
    - Scripting to video, live recording with the mouse and an automatic session builder
    - Output to Coyote 3 via Howl, a sound card (continuous / wavelet) and Intiface; export to .hwl and WAV/FLAC
    - Safety check for sudden jumps and long peaks, soft start, power limits and an Esc PANIC key
  file: StimStudio-1.0.0.zip (source)
  download: "https://github.com/PPPStimer/StimStudio/releases/latest"
  python: "Python 3.14+"
  requirements:
    - numpy>=2.4
    - PyQt6>=6.11
    - pyqtgraph>=0.14
    - soundfile>=0.14
    - sounddevice>=0.5
    - opensimplex>=0.4.5
  changelog:
    - version: v1.0.0
      date: 2026-11-22
      changes:
        - First release
  faq:
    - q: How do I install and start it?
      a: "Install Python 3.14 or newer, download the release and unpack it. In the unpacked folder run pip install -r requirements.txt (it also installs the optional packages for audio import and video), then double-click StimStudio.pyw."
    - q: Which devices can it play on?
      a: "A DG-Lab Coyote 3 through the Howl app on an Android phone (remote access over Wi-Fi), an e-stim box with an audio input connected to your sound card, and vibrators and other toys through Intiface Central. You can also export .hwl files for Howl and WAV/FLAC audio."
    - q: Is it safe?
      a: "Electrical stimulation can injure you. Read the Safety section of the README before you connect any device: use e-stim only below the waist, never with a pacemaker or heart condition, start at zero power and keep Esc (PANIC) at hand. StimStudio is not a medical device, and you use it at your own risk."
    - q: Does it run on Linux or macOS?
      a: "It is developed and tested on Windows. It is plain Python and Qt, so it should run elsewhere, but that hasn't been tested yet; on Linux sounddevice also needs PortAudio (libportaudio2)."
    - q: How do I update to a new version?
      a: "Download the latest release and replace the old files, then run the pip command again in case dependencies changed. Your projects, presets and settings are kept."
  screenshots:
    - /assets/img/stimstudio-1.jpg
    - /assets/img/stimstudio-2.jpg
    - /assets/img/stimstudio-3.jpg

- id: beatgen
  name: BeatGen
  color: blue
  icon: /assets/img/beatgen-icon.svg
  title: "BeatGen — a multitrack beatmeter generator"
  # GitHub repo "owner/name": version, size, download link, downloads and changelog
  # are loaded live from its Releases. Values below are the fallback.
  repo: PPPStimer/BeatGen
  asset: ""         # no build files yet: the release's source archive is offered
  version: v1.0.0
  size: 0.4 MB
  desc: "Make beatmeters, the animated markers that show the rhythm of a music track. Place beats on a timeline over your audio, detected automatically or by hand, add text and countdowns and watch the result in a live preview. BeatGen exports it as a PNG frame sequence to lay over your video, with matching audio and a CSV of beat times."
  features:
    - Opens WAV, MP3, FLAC and OGG, with a zoomable waveform and playback
    - Tempo and downbeat detection in the whole track or a selection, across the full range or just the kick, snare or hi-hat
    - Beat tracks with their own colour, click sound and icon, holding single beats and repeating patterns
    - Text and countdown tracks with fades, and a Visibility track that can hide the beats in pauses
    - "Visual styles: Dot Stream, Timeline Wave, Ripple Burst, Bar Slide, Radar Sweep and Particle Burst, with static or animated SVG icons"
    - Export a PNG sequence up to 3840×2160 at 1–120 fps, WAV with or without the beats, and beat times as CSV
    - Undo and redo, copy and paste, a snap grid, project files and autosave
  file: BeatGen-1.0.0.zip (source)
  download: "https://github.com/PPPStimer/BeatGen/releases/latest"
  python: "Python 3.12+"
  requirements:
    - PyQt6>=6.11.0
    - numpy>=2.4.6
    - librosa>=0.11.0
    - scipy>=1.18.0
    - soundfile>=0.14.0
    - Pillow>=12.2.0
    - sounddevice>=0.5.5
  changelog:
    - version: v1.0.0
      date: 2026-11-23
      changes:
        - First release
  faq:
    - q: How do I install and start it?
      a: "Install Python 3.12 or newer, download the release and unpack it. In the unpacked folder run pip install -r requirements.txt, then run python BeatGen.py, or on Windows double-click BeatGen.pyw. You don't need ffmpeg, MP3 included."
    - q: How do I put the beatmeter over my video?
      a: "Export Beatmeter Images gives a PNG sequence. For frames you can overlay, set the background's alpha to 0 in Beat Style. Import the frames into your video editor as an image sequence at the same frame rate, place them over the video and add the exported audio."
    - q: Does it connect to the internet?
      a: "Only to download the donation window's content from this site at launch. It uploads nothing about you or your projects, and works normally without internet access."
    - q: Does it run on Linux or macOS?
      a: "It is developed on Windows. The automated tests also pass on Linux, but the app itself hasn't been tried on a Linux desktop yet, and macOS is untested. On Linux, sounddevice also needs PortAudio (libportaudio2)."
    - q: How do I update to a new version?
      a: "Download the latest release and replace the old files, then run the pip command again in case dependencies changed. Your projects and settings are kept."
  screenshots:
    - /assets/img/beatgen-1.jpg
    - /assets/img/beatgen-2.jpg
    - /assets/img/beatgen-3.jpg
